
name: Baura ERP CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: erp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: ERP API Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build API
        run: npm run build

      - name: Verify API build
        run: test -f dist/src/server.js

  web:
    name: ERP Frontend Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build ERP frontend
        env:
          VITE_APP_BASE_PATH: /erp/
        run: npm run build

      - name: Verify ERP output
        run: test -f dist/index.html

      - name: Upload ERP frontend artifact
        uses: actions/upload-artifact@v6
        with:
          name: baura-erp-web-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7
