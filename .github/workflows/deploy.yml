
name: Baura ERP CD

on:
  workflow_run:
    workflows:
      - Baura ERP CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baura-erp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ERP to VPS
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    environment:
      name: production
      url: https://baurabakers.com/erp/

    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy verified commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash /var/www/baura-erp/deploy-erp.sh '$DEPLOY_SHA'"

      - name: Confirm deployment
        run: |
          echo "ERP deployment completed."
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "URL: https://baurabakers.com/erp/"
